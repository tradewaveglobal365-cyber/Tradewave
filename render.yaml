# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Migrations run in buildCommand rather than as a preDeployCommand because
# pre-deploy is a paid-plan feature. Putting them here means a failed migration
# fails the build, so the old version keeps serving instead of new code starting
# against an unmigrated database.
services:
  - type: web
    name: tradewave-api
    runtime: node
    plan: free
    rootDir: tradewave-api
    # --include=dev is required: NODE_ENV=production makes npm ci omit
    # devDependencies, which is where every @types/* package lives. tsc itself
    # survives as a transitive dep, so without this the build runs and fails with
    # "Could not find a declaration file" for express, cors, jsonwebtoken, etc.
    buildCommand: npm ci --include=dev && npm run db:deploy && npm run build
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

      # Supabase gives two strings. Pooled (6543) at runtime; direct (5432) for
      # migrations — PgBouncer cannot run them. See tradewave-api/prisma.config.ts.
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false

      # Generated once by Render. Changing it invalidates every live session.
      - key: JWT_SECRET
        generateValue: true

      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      # Where replies land. Several emails invite one — an account freeze, a
      # balance adjustment — and without this they go to noreply@ and vanish.
      - key: EMAIL_REPLY_TO
        sync: false

      # The Vercel production URL, scheme included and no trailing slash.
      # Used for CORS, the CSRF origin check, and links inside emails.
      - key: WEB_ORIGIN
        sync: false

      # Identity verification (Didit). All three or none — env.ts refuses a
      # half-configured provider, because sessions would start that no decision
      # could ever resolve. Leave unset to keep the stub driver.
      - key: DIDIT_API_KEY
        sync: false
      - key: DIDIT_WORKFLOW_ID
        sync: false
      # Shown once when the webhook destination is created. Store it then.
      - key: DIDIT_WEBHOOK_SECRET
        sync: false

      # Deposits (Klasha). All four or none — env.ts refuses a half-configured
      # provider, because we would hand a user an account number and then be
      # unable to confirm what lands in it. Leave unset to keep the stub driver,
      # which issues nothing in production.
      #   Sandbox https://dev.kcookery.com — live https://gate.klasapps.com
      #   HOST ONLY, no path: "/pay" is part of one endpoint in Klasha's docs,
      #   not part of the base, and env.ts refuses to boot with a path here.
      - key: KLASHA_BASE_URL
        sync: false
      - key: KLASHA_PUBLIC_KEY
        sync: false
      # Exactly 24 bytes. Several Klasha endpoints take a 3DES-encrypted body.
      - key: KLASHA_ENCRYPTION_KEY
        sync: false
      # ⚠️ Klasha mints its bearer token from ACCOUNT credentials rather than a
      # machine credential, so these are dashboard login details living in
      # deployment config. Ask them for a scoped API credential.
      - key: KLASHA_ACCOUNT_EMAIL
        sync: false
      - key: KLASHA_ACCOUNT_PASSWORD
        sync: false
      # Withdrawals only — it sits in the PATH of Klasha's payout endpoint.
      # Deliberately outside the all-or-nothing group: a deployment that only
      # takes deposits must not fail to boot because payouts were added.
      # NGN or GHS. Drives the collection account currency, the FX quote
      # currency, the payout bank list and the payout together.
      - key: COLLECTION_CURRENCY
        value: NGN

      - key: KLASHA_BUSINESS_ID
        sync: false

      # Listing photographs (Supabase Storage). Both or neither — without them
      # the admin can manage everything about a property except uploading a
      # photograph, which answers 503. The bucket must be PUBLIC-READ.
      #
      # ⚠️ The service-role key bypasses row-level security and can read and
      # write the whole database. Same handling as the Klasha password.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_PROPERTY_BUCKET
        value: property-images

      # Peppers the hash of government ID numbers. An 11-digit NIN has too little
      # entropy to survive an unkeyed digest, so this is what stands between a
      # database dump and every user's ID number.
      # ⚠️ Rotating this orphans every existing documentHash — duplicate
      # detection silently stops working for rows written before the change.
      - key: KYC_ID_PEPPER
        generateValue: true

      # Deliberately empty. The browser receives the cookie via the Vercel
      # rewrite, so it scopes to the Vercel origin on its own. Setting a domain
      # here would scope it to the API's domain and the browser would drop it.
      - key: COOKIE_DOMAIN
        value: ""
